version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend
    #mem_limit: 1024m
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongo
    restart: on-failure
    environment:
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DB=${MONGO_DB}
      - MONGO_AUTH_SOURCE=${MONGO_AUTH_SOURCE}
      - MONGO_URI=${MONGO_URI}

      - MONGO_EX_USER=${MONGO_EX_USER}
      - MONGO_EX_PASS=${MONGO_EX_PASS}

      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}

      - TMDB_API_KEY=${TMDB_API_KEY}

      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
    env_file:
      - .env
    networks:
      - netflix-network
  mongo:
    image: mongo:4.4
    #container_name: mongo-container
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
      #- ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - netflix-network
    restart: unless-stopped
    #command: ["mongod", "--auth", "--port", "${MONGO_PORT}"]
  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EX_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EX_PASS}
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS}
      ME_CONFIG_MONGODB_AUTH_DATABASE: ${MONGO_DB}
      ME_CONFIG_MONGODB_AUTH_SOURCE: ${MONGO_AUTH_SOURCE}
      ME_CONFIG_MONGODB_SERVER: ${MONGO_HOST}
      ME_CONFIG_MONGODB_PORT: ${MONGO_PORT}
    depends_on:
      - mongo
    networks:
      - netflix-network
    restart: unless-stopped
volumes:
  mongo-data:

networks:
  netflix-network:
    driver: bridge