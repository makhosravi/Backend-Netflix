version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 1024m
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/backend
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - MONGO_URL=${MONGO_URL}
    env_file:
      - .env
