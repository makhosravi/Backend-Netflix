version: '3.8'

services:
  backend:
    image: backend
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 1024m
    ports:
      - "4000:4000"
    #volumes:
    #  - ./backend:/usr/src/app/backend
    depends_on:
      - mongo
    environment:
      - NODE_ENV
      - PORT
      - MONGO_URI
      - JWT_SECRET
      - ACCESS_TOKEN_SECRET
      - REFRESH_TOKEN_SECRET
      - TMDB_API_KEY
    env_file:
      - .env
  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: Admin1342Server*
volumes:
  mongo-data: